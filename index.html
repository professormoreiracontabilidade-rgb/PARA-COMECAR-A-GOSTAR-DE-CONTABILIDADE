<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Começar a Gostar de Contabilidade</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(180deg,#020617,#0f172a,#1e3a8a);
  color:white;
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  padding:18px;
  display:flex;
  flex-direction:column;
}

.header{
  text-align:center;
  margin-bottom:14px;
}

.header h1{
  font-size:24px;
  line-height:1.2;
  color:#facc15;
}

.header p{
  font-size:16px;
  margin-top:6px;
  color:#dbeafe;
}

.card{
  background:white;
  color:#111827;
  border-radius:22px;
  padding:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.start-title{
  font-size:31px;
  font-weight:900;
  text-align:center;
  color:#1e3a8a;
  line-height:1.18;
}

.start-sub{
  text-align:center;
  font-size:20px;
  margin:22px 0;
  color:#111827;
  font-weight:bold;
}

.info{
  background:#dbeafe;
  padding:14px;
  border-radius:16px;
  font-size:18px;
  text-align:center;
  margin-bottom:18px;
}

button{
  border:none;
  border-radius:16px;
  padding:15px;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
}

.start-btn{
  background:#2563eb;
  color:white;
  width:100%;
  font-size:24px;
  padding:18px;
}

.topbar{
  display:none;
  margin-bottom:12px;
}

.status{
  display:flex;
  justify-content:space-between;
  font-size:15px;
  font-weight:bold;
  margin-bottom:8px;
}

.progress{
  background:#334155;
  height:12px;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  background:#22c55e;
  height:100%;
  width:0%;
  transition:.3s;
}

.question-number{
  font-size:18px;
  font-weight:900;
  color:#2563eb;
  margin-bottom:14px;
  text-align:center;
}

.question{
  font-size:24px;
  line-height:1.25;
  font-weight:900;
  text-align:center;
  margin-bottom:20px;
}

.option{
  width:100%;
  background:#eff6ff;
  color:#111827;
  border:3px solid #bfdbfe;
  margin:8px 0;
  text-align:left;
  font-size:21px;
}

.option.correct{
  background:#dcfce7;
  border-color:#16a34a;
  color:#166534;
}

.option.wrong{
  background:#fee2e2;
  border-color:#dc2626;
  color:#991b1b;
}

.option:disabled{
  opacity:1;
}

.feedback{
  text-align:center;
  font-size:22px;
  font-weight:900;
  margin-top:14px;
  min-height:32px;
}

.nav{
  display:none;
  gap:8px;
  margin-top:14px;
}

.nav button{
  flex:1;
  font-size:16px;
  padding:13px 6px;
}

.prev{background:#64748b;color:white;}
.restart{background:#f97316;color:white;}
.next{background:#2563eb;color:white;}

.final{
  text-align:center;
}

.final h2{
  font-size:34px;
  color:#16a34a;
  margin-bottom:18px;
}

.score{
  font-size:25px;
  font-weight:900;
  line-height:1.6;
}

.footer{
  text-align:center;
  color:#dbeafe;
  font-size:13px;
  margin-top:12px;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <h1>📚 COMEÇAR A GOSTAR DE CONTABILIDADE</h1>
    <p>Quiz Premium para Iniciantes</p>
  </div>

  <div class="topbar" id="topbar">
    <div class="status">
      <span id="qStatus">Questão 1 de 50</span>
      <span>✅ <span id="hits">0</span> | ❌ <span id="errors">0</span></span>
    </div>
    <div class="progress">
      <div class="progress-fill" id="progress"></div>
    </div>
  </div>

  <div class="card" id="screen"></div>

  <div class="nav" id="nav">
    <button class="prev" onclick="prevQuestion()">⬅ Voltar</button>
    <button class="restart" onclick="restartQuiz()">🔄 Reiniciar</button>
    <button class="next" onclick="nextQuestion()">Próxima ➡</button>
  </div>

  <div class="footer">
    Curso de Contabilidade Professor Moreira
  </div>

</div>

<script>
const questions = [
{q:"O patrimônio de uma entidade é composto por:",o:["Receitas e despesas","Bens, direitos e obrigações","Capital social e lucros","Apenas bens"],a:1},
{q:"Qual das contas abaixo é um exemplo de Ativo?",o:["Fornecedores","Empréstimos a Pagar","Caixa","Salários a Pagar"],a:2},
{q:"Qual das contas abaixo representa uma obrigação da empresa?",o:["Clientes","Estoques","Veículos","Fornecedores"],a:3},
{q:"O Patrimônio Líquido é calculado pela fórmula:",o:["Ativo + Passivo","Passivo − Ativo","Ativo − Passivo","Receita − Despesa"],a:2},
{q:"Quando a empresa recebe dinheiro de um cliente à vista, aumenta:",o:["Caixa","Fornecedores","Salários a Pagar","Empréstimos"],a:0},
{q:"A conta Clientes representa:",o:["Uma obrigação","Um direito a receber","Uma despesa","Uma receita"],a:1},
{q:"Qual das contas abaixo pertence ao Passivo?",o:["Caixa","Bancos","Estoques","Impostos a Recolher"],a:3},
{q:"A compra de mercadorias à vista provoca:",o:["Aumento do Caixa","Diminuição do Estoque","Aumento do Estoque e diminuição do Caixa","Aumento do Passivo"],a:2},
{q:"Qual das contas abaixo é considerada um bem?",o:["Clientes","Fornecedores","Veículos","Empréstimos a Pagar"],a:2},
{q:"Ativo de R$ 100.000 e Passivo de R$ 40.000. O Patrimônio Líquido será:",o:["R$ 60.000","R$ 140.000","R$ 40.000","R$ 100.000"],a:0},

{q:"Bancos Conta Movimento é classificada como:",o:["Passivo","Receita","Ativo","Despesa"],a:2},
{q:"Quando a empresa paga uma dívida em dinheiro, ocorre:",o:["Aumento do Caixa","Redução do Caixa e redução da obrigação","Aumento do Passivo","Aumento do Patrimônio Líquido"],a:1},
{q:"Qual conta representa um direito da empresa?",o:["Fornecedores","Salários a Pagar","Clientes","Impostos a Recolher"],a:2},
{q:"Um veículo comprado para uso da empresa é registrado no:",o:["Ativo","Passivo","Patrimônio Líquido","Resultado"],a:0},
{q:"A conta Fornecedores surge quando a empresa:",o:["Vende mercadorias","Compra mercadorias a prazo","Recebe empréstimo","Recebe de clientes"],a:1},
{q:"Qual item é uma obrigação?",o:["Estoques","Caixa","Empréstimos a Pagar","Clientes"],a:2},
{q:"A empresa recebeu R$ 5.000 de venda à vista. Qual conta aumenta?",o:["Fornecedores","Caixa","Salários a Pagar","Capital Social"],a:1},
{q:"O conjunto de bens, direitos e obrigações é denominado:",o:["Receita","Resultado","Patrimônio","Capital"],a:2},
{q:"Bens de R$ 40.000 e direitos de R$ 20.000. O Ativo é:",o:["R$ 15.000","R$ 45.000","R$ 60.000","R$ 75.000"],a:2},
{q:"A equação patrimonial básica é:",o:["Ativo = Passivo + Patrimônio Líquido","Passivo = Ativo + Receita","Receita = Despesa + Ativo","PL = Receita + Despesa"],a:0},

{q:"A conta Caixa é classificada como:",o:["Receita","Despesa","Ativo","Passivo"],a:2},
{q:"Quando a empresa compra mercadorias à vista, ocorre:",o:["Aumento do Caixa","Diminuição do Estoque","Aumento do Estoque e diminuição do Caixa","Aumento do PL"],a:2},
{q:"Qual conta representa um bem?",o:["Clientes","Veículos","Fornecedores","Empréstimos a Pagar"],a:1},
{q:"Uma dívida com fornecedores fica no:",o:["Ativo","Patrimônio Líquido","Passivo","Resultado"],a:2},
{q:"Ao receber empréstimo bancário em dinheiro:",o:["Aumenta Caixa e Passivo","Diminui Caixa e aumenta Passivo","Aumenta Caixa e diminui Passivo","Aumenta PL"],a:0},
{q:"Qual conta é um direito?",o:["Clientes","Salários a Pagar","Fornecedores","Empréstimos a Pagar"],a:0},
{q:"Ativo de R$ 90.000 e Passivo de R$ 35.000. O PL será:",o:["R$ 55.000","R$ 90.000","R$ 35.000","R$ 125.000"],a:0},
{q:"Qual conta pertence ao Ativo?",o:["Capital Social","Fornecedores","Bancos Conta Movimento","Salários a Pagar"],a:2},
{q:"Ao pagar fornecedores em dinheiro, ocorre:",o:["Diminui Caixa e Passivo","Aumenta Caixa e diminui Passivo","Diminui Caixa e aumenta Passivo","Aumenta Caixa e Passivo"],a:0},
{q:"Bens de R$ 50.000 e direitos de R$ 30.000. O Ativo é:",o:["R$ 20.000","R$ 50.000","R$ 30.000","R$ 80.000"],a:3},

{q:"A conta Estoques é classificada como:",o:["Passivo","Ativo","Receita","Despesa"],a:1},
{q:"Na venda à vista, com recebimento imediato, aumenta:",o:["Fornecedores","Salários a Pagar","Caixa","Empréstimos"],a:2},
{q:"Qual conta representa uma obrigação?",o:["Caixa","Clientes","Estoques","Impostos a Recolher"],a:3},
{q:"Ativo de R$ 120.000 e Passivo de R$ 50.000. O PL será:",o:["R$ 170.000","R$ 70.000","R$ 50.000","R$ 120.000"],a:1},
{q:"Qual item é considerado bem?",o:["Fornecedores","Clientes","Veículos","Salários a Pagar"],a:2},
{q:"Ao receber de cliente uma dívida antiga em dinheiro, aumenta:",o:["Caixa","Fornecedores","Empréstimos","Impostos"],a:0},
{q:"Salários a Pagar pertence ao:",o:["Ativo","Passivo","Patrimônio Líquido","Resultado"],a:1},
{q:"A soma dos bens e direitos corresponde ao:",o:["Patrimônio Líquido","Passivo","Capital Social","Ativo"],a:3},
{q:"Computador comprado para uso administrativo é registrado no:",o:["Ativo","Passivo","Receita","Patrimônio Líquido"],a:0},
{q:"Bens de R$ 60.000, direitos de R$ 15.000 e obrigações de R$ 25.000. O PL será:",o:["R$ 25.000","R$ 50.000","R$ 75.000","R$ 100.000"],a:1},

{q:"A conta Clientes representa:",o:["Uma obrigação","Um bem","Um direito","Uma despesa"],a:2},
{q:"Compra de mercadorias a prazo gera normalmente:",o:["Caixa","Fornecedores","Bancos","Capital Social"],a:1},
{q:"Qual conta pertence ao Ativo?",o:["Fornecedores","Salários a Pagar","Estoques","Empréstimos a Pagar"],a:2},
{q:"Ativo de R$ 150.000 e Passivo de R$ 90.000. O PL será:",o:["R$ 60.000","R$ 90.000","R$ 150.000","R$ 240.000"],a:0},
{q:"Qual conta representa uma dívida?",o:["Caixa","Clientes","Veículos","Fornecedores"],a:3},
{q:"Ao receber empréstimo bancário em dinheiro, a empresa:",o:["Aumenta Caixa e Passivo","Diminui Caixa e aumenta Passivo","Aumenta Caixa e diminui Passivo","Aumenta apenas o PL"],a:0},
{q:"O conjunto de obrigações da empresa é chamado de:",o:["Ativo","Patrimônio Líquido","Passivo","Receita"],a:2},
{q:"Qual conta é considerada um bem?",o:["Estoques","Fornecedores","Impostos a Recolher","Empréstimos a Pagar"],a:0},
{q:"Bens de R$ 90.000 e direitos de R$ 20.000. O Ativo será:",o:["R$ 20.000","R$ 70.000","R$ 90.000","R$ 110.000"],a:3},
{q:"Ativo de R$ 200.000 e Passivo de R$ 80.000. O PL corresponde a:",o:["R$ 120.000","R$ 280.000","R$ 80.000","R$ 200.000"],a:0}
];

let current = 0;
let answers = Array(questions.length).fill(null);
let started = false;

const screen = document.getElementById("screen");
const topbar = document.getElementById("topbar");
const nav = document.getElementById("nav");

function save(){
  localStorage.setItem("quizContabilidade", JSON.stringify({current,answers,started}));
}

function load(){
  const data = localStorage.getItem("quizContabilidade");
  if(data){
    const obj = JSON.parse(data);
    current = obj.current || 0;
    answers = obj.answers || Array(questions.length).fill(null);
    started = obj.started || false;
  }
}

function startQuiz(){
  started = true;
  save();
  renderQuestion();
}

function renderStart(){
  topbar.style.display="none";
  nav.style.display="none";
  screen.innerHTML = `
    <div class="start-title">📚 COMEÇAR A GOSTAR DE CONTABILIDADE</div>
    <div class="start-sub">Aprenda o básico acertando uma questão de cada vez.</div>
    <div class="info">
      ✅ 50 questões básicas<br>
      ✅ Uma questão por tela<br>
      ✅ Letras grandes<br>
      ✅ Ideal para iniciantes
    </div>
    <button class="start-btn" onclick="startQuiz()">▶ COMEÇAR</button>
  `;
}

function renderQuestion(){
  topbar.style.display="block";
  nav.style.display="flex";

  const q = questions[current];
  const answered = answers[current];

  updateStatus();

  let html = `
    <div class="question-number">Questão ${current+1} de ${questions.length}</div>
    <div class="question">${q.q}</div>
  `;

  q.o.forEach((opt,i)=>{
    let cls = "";
    if(answered !== null){
      if(i === q.a) cls = "correct";
      else if(i === answered) cls = "wrong";
    }
    html += `<button class="option ${cls}" onclick="answer(${i})" ${answered!==null?'disabled':''}>
      ${String.fromCharCode(65+i)}) ${opt}
    </button>`;
  });

  html += `<div class="feedback" id="feedback">
    ${answered===null ? "" : answered===q.a ? "✅ Muito bem!" : "❌ Atenção! Veja a correta."}
  </div>`;

  screen.innerHTML = html;
  save();
}

function answer(i){
  if(answers[current] !== null) return;
  answers[current] = i;
  renderQuestion();
}

function nextQuestion(){
  if(current < questions.length - 1){
    current++;
    renderQuestion();
  }else{
    renderFinal();
  }
}

function prevQuestion(){
  if(current > 0){
    current--;
    renderQuestion();
  }
}

function restartQuiz(){
  if(confirm("Deseja reiniciar o quiz?")){
    current = 0;
    answers = Array(questions.length).fill(null);
    started = true;
    save();
    renderQuestion();
  }
}

function updateStatus(){
  let hits = 0;
  let errors = 0;

  answers.forEach((ans,i)=>{
    if(ans !== null){
      if(ans === questions[i].a) hits++;
      else errors++;
    }
  });

  document.getElementById("hits").textContent = hits;
  document.getElementById("errors").textContent = errors;
  document.getElementById("qStatus").textContent = `Questão ${current+1} de ${questions.length}`;
  document.getElementById("progress").style.width = ((current+1)/questions.length*100)+"%";
}

function renderFinal(){
  topbar.style.display="none";
  nav.style.display="none";

  let hits = 0;
  let errors = 0;

  answers.forEach((ans,i)=>{
    if(ans === questions[i].a) hits++;
    else errors++;
  });

  let percent = Math.round((hits/questions.length)*100);

  screen.innerHTML = `
    <div class="final">
      <h2>🏆 PARABÉNS!</h2>
      <div class="score">
        ✅ Acertos: ${hits}<br>
        ❌ Erros: ${errors}<br>
        📊 Aproveitamento: ${percent}%
      </div>
      <br>
      <div class="info">
        Você acabou de dar mais um passo para dominar a Contabilidade.
      </div>
      <button class="start-btn" onclick="restartQuiz()">🔄 Jogar Novamente</button>
    </div>
  `;
}

load();

if(started){
  renderQuestion();
}else{
  renderStart();
}
</script>

</body>
</html>
